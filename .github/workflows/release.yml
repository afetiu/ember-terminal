# Builds Ember for Windows from source, signs it through SignPath (when configured),
# and attaches the installer, portable .zip and .tar.gz to the GitHub Release.
#
# Push a version tag (v*), or dispatch by hand with a tag name. Signing needs the
# repository secret SIGNPATH_API_TOKEN and the variable SIGNPATH_ORGANIZATION_ID; without
# them the same build runs unsigned. Every signing request waits for manual approval in
# SignPath. See CODE_SIGNING.md.
#
# Two jobs so the one holding write access runs no build code: `build` reads the repo,
# builds and signs, and hands the files over as an artifact; `release` only publishes
# them. Third-party actions are pinned to commit SHAs.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release as (e.g. v1.0.1)'
        required: true
        type: string

permissions: {}

env:
  SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
  SIGNPATH_PROJECT: ember
  SIGNPATH_POLICY: release-signing

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      # SignPath fetches the uploaded artifacts through the Actions API.
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # First, so a bad tag fails before an hour of building. Passed through env, never
      # pasted into the script.
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck + bundle, then the unpacked app only. --publish never: electron-builder
      # turns on implicit publishing when it smells CI and then fails wanting a token.
      - run: pnpm run build
      - run: pnpm exec electron-builder --win dir --publish never

      - name: Upload the unsigned app
        id: upload-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ember-app-unsigned
          path: release/win-unpacked
          if-no-files-found: error

      - name: Sign Ember.exe
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/win-unpacked-signed

      - name: Use the signed app
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force release/win-unpacked
          Move-Item release/win-unpacked-signed release/win-unpacked

      # Installer, .zip and .tar.gz, all built from the (signed) folder above.
      - run: pnpm exec electron-builder --win --prepackaged release/win-unpacked --publish never

      - name: Upload the unsigned installer
        id: upload-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ember-installer-unsigned
          path: release/Ember-Setup-win-x64.exe
          if-no-files-found: error

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/signed

      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: Move-Item -Force release/signed/Ember-Setup-win-x64.exe release/Ember-Setup-win-x64.exe

      - name: Checksums
        shell: bash
        run: cd release && sha256sum Ember-Setup-win-x64.exe Ember-win-x64.zip Ember-win-x64.tar.gz | tee SHA256SUMS.txt

      - name: Hand the release files to the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ember-release
          path: |
            release/Ember-Setup-win-x64.exe
            release/Ember-win-x64.zip
            release/Ember-win-x64.tar.gz
            release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ember-release
          path: release

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: |
            release/Ember-Setup-win-x64.exe
            release/Ember-win-x64.zip
            release/Ember-win-x64.tar.gz
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
