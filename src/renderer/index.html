<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `connect-src` is what lets the renderer reach the phone relay. Without it the
      WebSocket never opens, `default-src 'self'` having silently covered it, and the link
      sits in "connecting" forever while the desk looks paired and unreachable.

      Scoped to workers.dev because that is where the relay is deployed (DEFAULT_RELAY in
      src/main/remote.ts; the old Heroku one is retired). Pointing Ember at a relay on
      another host means changing this line too — the failure will look like a network
      problem rather than a policy one.

      `img-src https:` stays for a remote picture in a reply, which is fetched only once it
      is clicked (canvas/markdown.ts): a reply never sets a remote src on its own.
      `object-src` and `base-uri` are shut because nothing here uses them, and both are
      ways for injected markup to load code or re-point every relative URL on the page.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:* https:; media-src 'self' blob: data: http://127.0.0.1:* https:; font-src 'self'; frame-src http://localhost:5178 http://127.0.0.1:*; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* https://*.workers.dev wss://*.workers.dev; object-src 'none'; base-uri 'none'"
    />
    <title>Ember</title>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
