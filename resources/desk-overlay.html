<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Ember's pointer</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; }

  /* Ember's pointer: an SVG arrow moved by transform alone, so the compositor does the work. */
  #ptr {
    position: fixed; left: 0; top: 0; width: 0; height: 0;
    will-change: transform; opacity: 0;
    transition: opacity 250ms cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }
  #ptr.on { opacity: 1; }
  #ptr svg {
    position: absolute; left: -2px; top: -2px; width: 26px; height: 30px; overflow: visible;
    transform-origin: 2px 2px;
    filter: drop-shadow(0 0 6px rgba(242, 164, 58, 0.55)) drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45));
  }
  #tag {
    position: absolute; left: 20px; top: 24px;
    padding: 4px 10px 5px; border-radius: 999px; white-space: nowrap;
    font: 600 12px/1 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
    color: #fff3e2; background: rgba(28, 18, 10, 0.86);
    box-shadow: 0 0 0 1px rgba(242, 164, 58, 0.45) inset, 0 6px 18px rgba(0, 0, 0, 0.4);
    opacity: 0; transform: translateY(-2px);
    transition: opacity 260ms cubic-bezier(0.22, 1, 0.36, 1), transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  #tag.on { opacity: 1; transform: none; }

  .ripple {
    position: fixed; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
    border: 2px solid rgba(242, 164, 58, 0.9); pointer-events: none;
    animation: ripple 520ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes ripple { from { transform: scale(0.6); opacity: 1; } to { transform: scale(4.2); opacity: 0; } }

  /* The callout: what it is pointing at, said next to it. */
  #callout {
    position: fixed; left: 0; top: 0; max-width: 300px; padding: 12px 14px 12px;
    border-radius: 12px; color: #f6eee4;
    font: 400 13px/1.5 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
    background: rgba(30, 22, 15, 0.9);
    -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), inset 0 0 0 1px rgba(242, 164, 58, 0.28), 0 16px 40px -10px rgba(0, 0, 0, 0.6);
    opacity: 0; transform: translateY(4px) scale(0.98); pointer-events: none;
    transition: opacity 200ms cubic-bezier(0.22, 1, 0.36, 1), transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  #callout.on { opacity: 1; transform: none; }
  #callout .step { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #f2a43a; margin-bottom: 4px; }
  #callout .step:empty { display: none; }
  #callout .btns { display: none; gap: 6px; margin-top: 10px; justify-content: flex-end; }
  #callout.steps .btns { display: flex; }
  #callout button {
    border: 0; border-radius: 8px; padding: 5px 12px; cursor: pointer;
    font: 600 12px 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
    color: #f6eee4; background: rgba(255, 255, 255, 0.08);
    transition: background-color 150ms;
  }
  #callout button:hover { background: rgba(255, 255, 255, 0.16); }
  #callout button.primary { background: #f2a43a; color: #1c1209; }
  #callout button.primary:hover { background: #f6b85c; }
  #notch {
    position: absolute; width: 10px; height: 10px; background: rgba(30, 22, 15, 0.9);
    box-shadow: inset 1px 1px 0 rgba(242, 164, 58, 0.28); transform: rotate(45deg);
  }

  /* The one thing always pressable: Stop. */
  #stop {
    position: fixed; right: 18px; bottom: 64px;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px 9px 12px;
    border-radius: 999px;
    font: 600 12.5px/1 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.2px;
    color: #fff;
    background: rgba(24, 14, 8, 0.78);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(242, 164, 58, 0.45);
    backdrop-filter: blur(10px);
    cursor: pointer;
    opacity: 0; transform: translateY(8px);
    transition: opacity 220ms ease, transform 220ms ease, background 160ms ease;
  }
  #stop.show { opacity: 1; transform: none; }
  #stop:hover { background: rgba(229, 72, 77, 0.92); }
  #stop .dot { width: 9px; height: 9px; border-radius: 2px; background: #e5484d; box-shadow: 0 0 10px #e5484d; }
  #stop.halted { background: rgba(40, 40, 44, 0.85); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.2); }
  #stop.halted .dot { background: #8bd17c; box-shadow: 0 0 10px #8bd17c; border-radius: 50%; }
  #stop.halted:hover { background: rgba(60, 100, 60, 0.9); }
</style>
</head>
<body>
<div id="ptr">
  <svg viewBox="0 0 26 30" aria-hidden="true">
    <defs>
      <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F7B652" />
        <stop offset="0.55" stop-color="#F2A43A" />
        <stop offset="1" stop-color="#E07A1F" />
      </linearGradient>
    </defs>
    <path d="M2 2 L2 21.5 Q2 22.6 2.9 22 L7.3 17.6 L10.6 25 Q11.1 26 12.1 25.6 L14.4 24.6 Q15.4 24.1 14.9 23.1 L11.7 16.2 L18.1 16 Q19.2 15.9 18.4 15.1 L3.1 1.2 Q2 0.3 2 2 Z"
          fill="url(#amber)" stroke="rgba(28,16,6,0.92)" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M3.6 4.6 L3.6 17.4" stroke="rgba(255,240,215,0.55)" stroke-width="1.1" stroke-linecap="round" />
  </svg>
  <div id="tag">Ember</div>
</div>
<div id="callout"><div id="notch"></div><div class="step"></div><div class="text"></div>
  <div class="btns"><button type="button" data-a="done">Done</button><button type="button" class="primary" data-a="next">Next</button></div></div>
<div id="stop"><span class="dot"></span><span id="stopText">Stop Ember</span></div>
<script>
  // Outside Ember (a preview in a browser) there is no bridge: a stand-in that does nothing.
  if (!window.overlay) {
    const cbs = {}
    window.overlay = { real: false, onState: (f) => (cbs.s = f), onCallout: (f) => (cbs.c = f), interactive() {}, stop() {}, calloutAction() {}, __callout: (c) => cbs.c && cbs.c(c) }
  }
  const ptr = document.getElementById('ptr')
  const svg = ptr.querySelector('svg')
  const tag = document.getElementById('tag')
  const callout = document.getElementById('callout')
  const notch = document.getElementById('notch')
  const stop = document.getElementById('stop')
  const stopText = document.getElementById('stopText')
  const dpr = () => window.devicePixelRatio || 1

  // Where the pointer is drawn, where it is going, and how.
  const s = { x: -300, y: -300, visible: false, halted: false, label: '', lastMoveAt: 0, anim: null, pendingRipple: false, tilt: 0 }
  window.__desk = s   // read by scripts/probe-desk.mjs

  // The same glide as the daemon (desk.py _glide_ms): physical pixels -> 180..650 ms.
  function glideMs(dist) { return dist < 2 ? 0 : Math.max(180, Math.min(650, 180 + 95 * Math.log2(1 + dist / 60))) }
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2)

  function moveTo(tx, ty) {
    const now = performance.now()
    let sx = s.x, sy = s.y, dist
    if (!s.visible || now - s.lastMoveAt > 20000 || sx < -100) {
      // Appearing: come in from a little up and to the left, as a hand would.
      sx = tx - 110; sy = ty - 70; s.x = sx; s.y = sy; dist = 160
    } else dist = Math.hypot(tx - sx, ty - sy) * dpr()
    s.lastMoveAt = now
    const dur = glideMs(dist)
    if (!dur) { s.x = tx; s.y = ty; s.anim = null; return }
    const dx = tx - sx, dy = ty - sy, len = Math.hypot(dx, dy) || 1
    // A gentle bow to one side, and a few pixels past the target before it settles.
    const bow = Math.min(60, len * 0.12)
    const cx = (sx + tx) / 2 + (-dy / len) * bow, cy = (sy + ty) / 2 + (dx / len) * bow
    const over = Math.min(6, len * 0.02)
    s.anim = { sx, sy, cx, cy, tx, ty, ox: tx + (dx / len) * over, oy: ty + (dy / len) * over, t0: now, dur }
  }

  function ripple(x, y) {
    const r = document.createElement('div')
    r.className = 'ripple'; r.style.left = x + 'px'; r.style.top = y + 'px'
    document.body.appendChild(r)
    setTimeout(() => r.remove(), 600)
  }

  let px = s.x, py = s.y
  function frame(now) {
    const a = s.anim
    if (a) {
      const t = Math.min(1, (now - a.t0) / a.dur)
      if (t < 0.86) {
        const u = easeInOut(t / 0.86), v = 1 - u
        s.x = v * v * a.sx + 2 * u * v * a.cx + u * u * a.ox
        s.y = v * v * a.sy + 2 * u * v * a.cy + u * u * a.oy
      } else {
        const w = 1 - Math.pow(1 - (t - 0.86) / 0.14, 2)
        s.x = a.ox + (a.tx - a.ox) * w; s.y = a.oy + (a.ty - a.oy) * w
      }
      if (t >= 1) {
        s.x = a.tx; s.y = a.ty; s.anim = null
        if (s.pendingRipple) { ripple(s.x, s.y); s.pendingRipple = false }
      }
    }
    // A slight lean into the movement, easing back to upright at rest.
    const vx = s.x - px
    s.tilt += (Math.max(-8, Math.min(8, vx * 0.35)) - s.tilt) * 0.2
    px = s.x; py = s.y
    ptr.style.transform = `translate3d(${s.x.toFixed(2)}px, ${s.y.toFixed(2)}px, 0)`
    svg.style.transform = `rotate(${s.tilt.toFixed(2)}deg)`
    // The name tag shows while it moves and for a moment after; then it gets out of the way.
    const recent = now - s.lastMoveAt < 1500
    tag.classList.toggle('on', s.visible && !s.halted && recent)
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)

  window.overlay.onState((st) => {
    s.halted = !!st.halted
    s.visible = !!st.visible && !s.halted
    ptr.classList.toggle('on', s.visible)
    if (st.label != null) {
      s.label = st.label
      const t = st.label ? `Ember · ${st.label}` : 'Ember'
      tag.textContent = t.length > 52 ? t.slice(0, 51) + '…' : t
    }
    if (st.point && s.visible) {
      const sameSpot = Math.abs(st.point.x - (s.anim ? s.anim.tx : s.x)) < 1 && Math.abs(st.point.y - (s.anim ? s.anim.ty : s.y)) < 1
      if (!sameSpot) moveTo(st.point.x, st.point.y)
    }
    if (st.action === 'click' || st.action === 'drag') {
      if (s.anim) s.pendingRipple = true
      else ripple(s.x, s.y)
    }
    stop.classList.toggle('show', st.showStop !== false && (s.visible || s.halted))
    stop.classList.toggle('halted', s.halted)
    stopText.textContent = s.halted ? 'Resume Ember' : 'Stop Ember'
    if (s.halted || !s.visible) hideCallout()
  })

  // ---- the callout ----
  let calloutTimer = 0
  function hideCallout() {
    clearTimeout(calloutTimer)
    callout.classList.remove('on', 'steps')
  }
  function place(c) {
    const W = innerWidth, H = innerHeight, gap = 14
    const r = c.rect || { left: c.x - 2, top: c.y - 2, right: c.x + 22, bottom: c.y + 28 }
    const bw = callout.offsetWidth, bh = callout.offsetHeight
    const cy = (r.top + r.bottom) / 2
    const clampY = (y) => Math.max(10, Math.min(H - bh - 10, y))
    const clampX = (x) => Math.max(10, Math.min(W - bw - 10, x))
    let side, left, top
    if (r.right + gap + bw + 10 <= W) { side = 'right'; left = r.right + gap; top = clampY(cy - bh / 2) }
    else if (r.left - gap - bw >= 10) { side = 'left'; left = r.left - gap - bw; top = clampY(cy - bh / 2) }
    else if (r.bottom + gap + bh + 10 <= H) { side = 'below'; top = r.bottom + gap; left = clampX((r.left + r.right) / 2 - bw / 2) }
    else { side = 'above'; top = Math.max(10, r.top - gap - bh); left = clampX((r.left + r.right) / 2 - bw / 2) }
    callout.style.left = left + 'px'; callout.style.top = top + 'px'
    // The notch faces the target.
    notch.style.left = notch.style.right = notch.style.top = notch.style.bottom = ''
    if (side === 'right') { notch.style.left = '-5px'; notch.style.top = Math.max(10, Math.min(bh - 20, cy - top - 5)) + 'px' }
    else if (side === 'left') { notch.style.right = '-5px'; notch.style.top = Math.max(10, Math.min(bh - 20, cy - top - 5)) + 'px' }
    else if (side === 'below') { notch.style.top = '-5px'; notch.style.left = Math.max(12, Math.min(bw - 22, (r.left + r.right) / 2 - left - 5)) + 'px' }
    else { notch.style.bottom = '-5px'; notch.style.left = Math.max(12, Math.min(bw - 22, (r.left + r.right) / 2 - left - 5)) + 'px' }
  }
  window.overlay.onCallout((c) => {
    if (!c || !c.text) return hideCallout()
    clearTimeout(calloutTimer)
    callout.querySelector('.text').textContent = c.text
    callout.querySelector('.step').textContent = c.steps ? `Step ${c.step || 1} of ${c.steps}` : ''
    const steps = !!c.steps
    callout.classList.toggle('steps', steps)
    const next = callout.querySelector('[data-a="next"]')
    next.style.display = steps && (c.step || 1) < c.steps ? '' : 'none'
    // Wait for the pointer to get there, then speak.
    const wait = s.anim ? Math.max(0, s.anim.t0 + s.anim.dur - performance.now()) : 0
    callout.classList.remove('on')
    setTimeout(() => {
      place(c)
      callout.classList.add('on')
      if (!steps) calloutTimer = setTimeout(hideCallout, 4000 + 60 * c.text.length)
    }, wait)
  })
  callout.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-a]')
    if (!b) return
    window.overlay.calloutAction(b.dataset.a)
    hideCallout()
    window.overlay.interactive(false); interactive = false
  })

  // Click-through everywhere except Stop and the callout's buttons: tell Ember when the mouse is over one.
  let interactive = false
  function over(el, e) {
    const r = el.getBoundingClientRect()
    return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom
  }
  addEventListener('mousemove', (e) => {
    const hit = (stop.classList.contains('show') && over(stop, e)) ||
      (callout.classList.contains('on') && callout.classList.contains('steps') && over(callout, e))
    if (hit !== interactive) { interactive = hit; window.overlay.interactive(hit) }
  })
  stop.addEventListener('click', () => window.overlay.stop())

  // For a preview without Ember: open this file with ?demo.
  if (location.search.includes('demo') && !window.overlay.real) {
    s.visible = true; ptr.classList.add('on')
    moveTo(520, 300)
    setTimeout(() => window.overlay.__callout({ text: 'This is the Save button. Press it when the draft is ready — Ember will not press it for you.', x: 520, y: 300, rect: { left: 470, top: 286, right: 570, bottom: 316 }, step: 2, steps: 4 }), 50)
  }
</script>
</body>
</html>
