<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ember voice</title>
<style>
  /* Nothing here is ever seen — the frame is 0×0 in the renderer. The audio element is
     the only element that matters, and it only has to exist and be allowed to play. */
  html, body { margin: 0; width: 0; height: 0; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<audio id="out" autoplay></audio>
<script src="/realtime/rtc.js"></script>
</body>
</html>
