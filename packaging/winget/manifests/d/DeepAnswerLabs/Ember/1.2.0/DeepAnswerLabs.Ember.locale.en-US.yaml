ShortDescription: A Windows terminal for working alongside coding agents. No API keys.
Description: |-
  Ember is a Windows terminal built around the coding-agent CLIs you already use: Claude Code, Codex CLI, Gemini CLI, Cursor Agent, OpenCode and Copilot CLI.
  PowerShell runs underneath through the same ConPTY Windows Terminal ships, so your profile, prompt and modules behave as before.
  Ember never asks for an LLM API key: its AI features (the project map, the panel, the orchestrator) run through the CLI you pick, signed in with your own plan.
